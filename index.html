* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
}

body {
  font-family: 'Roboto Light', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  color: #f0f0f0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  touch-action: manipulation;
}

#stage {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 3.5vmin 4vmin 0 4vmin;
}

/* ---- weather, top left ---- */
#weather {
  display: flex;
  align-items: center;
}
#w-icon {
  width: 8.4vmin;
  height: 8.4vmin;
  margin-right: 2.2vmin;
}
.w-temp {
  font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  font-size: 13vmin;
  font-weight: bold;
  color: var(--c-temp, #f0f0f0);
  line-height: 1;
  letter-spacing: 0.02em;
}
.w-temp .deg {
  font-size: 0.45em;
  color: var(--c-cond, #bbb);
  margin-left: 0.15em;
}
.w-cond {
  font-size: 2.6vmin;
  color: var(--c-cond, #ddd);
  margin-top: 1.1vmin;
}
.w-meta {
  font-size: 1.8vmin;
  color: var(--c-meta, #777);
  margin-top: 0.7vmin;
}

/* ---- sunrise / sunset, top right ---- */
#sun {
  text-align: right;
}
.s-row {
  display: flex;
  justify-content: flex-end;
  align-items: baseline;
  margin-bottom: 1.2vmin;
}
.s-row:last-child { margin-bottom: 0; }
.s-glyph {
  font-size: 3.9vmin;
  margin-right: 1vmin;
  color: var(--c-accent, #f5a623);
}
.s-lbl {
  font-size: 2.6vmin;
  color: var(--c-meta, #888);
  margin-right: 1.2vmin;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.s-val {
  font-family: 'Roboto Light', 'Roboto', Arial, sans-serif;
  font-size: 5.1vmin;
  font-weight: 300;
  color: var(--c-accent, #f5a623);
}

/* ---- clock and date, center ---- */
#clockbox {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-bottom: 4vmin;
}
#cluster {
  display: inline-block;
}
#clock {
  font-family: 'DSEG7', 'Lucida Console', monospace;
  color: var(--c-clock, #c2c2c2);
  text-align: center;
  text-shadow: var(--c-glow, 0 0 24px rgba(255, 255, 255, 0.18));
  white-space: nowrap;
  transition: text-shadow 1.5s ease;
}
#clock .c {
  color: var(--c-dots, #6e6e6e);
  text-shadow: none;
}
#ss { font-size: 0.5em; margin-left: 0.25em; }
#date {
  text-align: right;
  font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  font-size: 7.2vmin;
  font-weight: bold;
  color: var(--c-date, #a5a5a5);
  margin-top: 2.2vmin;
  letter-spacing: 0.08em;
}

/* ---- night dim overlay ---- */
#shade {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.82);
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s ease;
  z-index: 9;
}
body.night #shade { opacity: 1; }
body.night #clock {
  text-shadow: 0 0 14px rgba(255, 255, 255, 0.06);
}

/* ---- discrete buttons, bottom left ---- */
#ctrls {
  position: fixed;
  left: 3.2vmin;
  bottom: 3.2vmin;
  z-index: 10;
  display: flex;
}
#rctrls {
  position: fixed;
  right: 3.2vmin;
  bottom: 3.2vmin;
  z-index: 10;
  display: flex;
}
#ctrls button,
#rctrls button {
  width: 5.4vmin;
  height: 5.4vmin;
  min-width: 40px;
  min-height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.04);
  color: rgba(255, 255, 255, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.26;
  cursor: pointer;
  transition: opacity 1s ease, background 1s ease;
  padding: 0;
}
#ctrls button + button { margin-left: 1.8vmin; }
#rctrls button + button { margin-left: 1.8vmin; }
#ctrls button svg,
#rctrls button svg { width: 55%; height: 55%; }
#ctrls button:active,
#rctrls button:active { background: rgba(255, 255, 255, 0.12); }
body.night #ctrls button,
body.night #rctrls button { opacity: 0.1; border-color: rgba(255,255,255,0.12); }

/* ---- glitch mode ---- */
#glitch-veil {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  opacity: 0;
  background: repeating-linear-gradient(0deg,
    rgba(0, 0, 0, 0.5) 0px, rgba(0, 0, 0, 0.5) 2px,
    rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 4px);
  z-index: 8;
}
#glitch-veil:after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  top: 12%;
  height: 12px;
  background: rgba(140, 220, 255, 0.18);
  opacity: 0;
}
body.glitch #glitch-veil {
  animation: glVeilFlicker 2.9s steps(1) infinite;
}
body.glitch #glitch-veil:after {
  animation: glSlice 3.1s steps(1) infinite;
}
body.glitch #stage {
  animation: glJitter 2.3s steps(1) infinite;
  filter: saturate(0.72) contrast(1.06);
}
body.glitch #clock {
  text-shadow: -0.02em 0 rgba(255, 0, 80, 0.55), 0.02em 0 rgba(0, 220, 255, 0.45);
}
body.glitch:not(.night) #shade { opacity: 0.4; }

@keyframes glVeilFlicker {
  0%   { opacity: 1; }
  8%   { opacity: 0.55; }
  12%  { opacity: 1; }
  33%  { opacity: 0.8; }
  34%  { opacity: 1; }
  62%  { opacity: 0.4; }
  63%  { opacity: 1; }
  100% { opacity: 1; }
}
@keyframes glSlice {
  0%   { top: 12%; opacity: 0.6; }
  22%  { top: 58%; opacity: 0.9; }
  23%  { top: 34%; opacity: 0.3; }
  48%  { top: 76%; opacity: 0.7; }
  49%  { top: 8%;  opacity: 0; }
  100% { top: 8%;  opacity: 0; }
}
@keyframes glJitter {
  0%   { transform: none; clip-path: none; }
  13%  { transform: translateX(-6px); clip-path: none; }
  14%  { transform: translateX(3px); clip-path: none; }
  15%  { transform: none; clip-path: none; }
  38%  { transform: translateX(9px) skewX(-1.5deg); clip-path: none; }
  41%  { transform: none; clip-path: none; }
  67%  { transform: translateY(4px); clip-path: inset(18% 0 42% 0); }
  70%  { transform: none; clip-path: none; }
  89%  { transform: translateX(-4px); clip-path: inset(52% 0 12% 0); }
  92%  { transform: none; clip-path: none; }
  100% { transform: none; clip-path: none; }
}

/* ---- color themes (popular dark editor / shell schemes) ---- */
[data-theme="dracula"] {
  --c-clock: #bd93f9; --c-glow: 0 0 24px rgba(189, 147, 249, 0.28);
  --c-dots: #6272a4; --c-date: #f8f8f2; --c-temp: #8be9fd;
  --c-cond: #f8f8f2; --c-meta: #6272a4; --c-accent: #ff79c6;
}
[data-theme="nord"] {
  --c-clock: #88c0d0; --c-glow: 0 0 24px rgba(136, 192, 208, 0.25);
  --c-dots: #4c566a; --c-date: #d8dee9; --c-temp: #8fbcbb;
  --c-cond: #d8dee9; --c-meta: #4c566a; --c-accent: #ebcb8b;
}
[data-theme="solarized-dark"] {
  --c-clock: #268bd2; --c-glow: 0 0 24px rgba(38, 139, 210, 0.3);
  --c-dots: #586e75; --c-date: #93a1a1; --c-temp: #2aa198;
  --c-cond: #839496; --c-meta: #586e75; --c-accent: #b58900;
}
[data-theme="monokai"] {
  --c-clock: #66d9ef; --c-glow: 0 0 24px rgba(102, 217, 239, 0.25);
  --c-dots: #75715e; --c-date: #f8f8f2; --c-temp: #fd971f;
  --c-cond: #f8f8f2; --c-meta: #75715e; --c-accent: #f92672;
}
[data-theme="one-dark"] {
  --c-clock: #61afef; --c-glow: 0 0 24px rgba(97, 175, 239, 0.25);
  --c-dots: #5c6370; --c-date: #abb2bf; --c-temp: #98c379;
  --c-cond: #abb2bf; --c-meta: #5c6370; --c-accent: #e5c07b;
}
[data-theme="gruvbox"] {
  --c-clock: #fabd2f; --c-glow: 0 0 24px rgba(250, 189, 47, 0.25);
  --c-dots: #928374; --c-date: #ebdbb2; --c-temp: #8ec07c;
  --c-cond: #ebdbb2; --c-meta: #928374; --c-accent: #fe8019;
}
[data-theme="tokyo-night"] {
  --c-clock: #7aa2f7; --c-glow: 0 0 24px rgba(122, 162, 247, 0.28);
  --c-dots: #565f89; --c-date: #a9b1d6; --c-temp: #9ece6a;
  --c-cond: #a9b1d6; --c-meta: #565f89; --c-accent: #e0af68;
}
[data-theme="catppuccin-mocha"] {
  --c-clock: #cba6f7; --c-glow: 0 0 24px rgba(203, 166, 247, 0.28);
  --c-dots: #6c7086; --c-date: #cdd6f4; --c-temp: #89b4fa;
  --c-cond: #cdd6f4; --c-meta: #6c7086; --c-accent: #fab387;
}
[data-theme="rose-pine"] {
  --c-clock: #c4a7e7; --c-glow: 0 0 24px rgba(196, 167, 231, 0.28);
  --c-dots: #6e6a86; --c-date: #e0def4; --c-temp: #9ccfd8;
  --c-cond: #e0def4; --c-meta: #6e6a86; --c-accent: #eb6f92;
}
[data-theme="synthwave84"] {
  --c-clock: #fe4fa4; --c-glow: 0 0 26px rgba(254, 79, 164, 0.4);
  --c-dots: #848bb1; --c-date: #f7f7f7; --c-temp: #f97e72;
  --c-cond: #f7f7f7; --c-meta: #848bb1; --c-accent: #36f9f6;
}
</style>
</head>
<body>

<div id="stage">
  <header>
    <section id="weather" aria-label="Weather in Ciarda Rosie (meteoblue)">
      <img id="w-icon" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
      <div>
        <div class="w-temp"><span id="w-temp">&ndash;</span><span class="deg">&deg;C</span></div>
        <div class="w-cond" id="w-cond">&nbsp;</div>
        <div class="w-meta" id="w-meta">meteoblue &middot; Ciarda Rosie</div>
      </div>
    </section>

    <section id="sun" aria-label="Sunrise and sunset">
      <div class="s-row">
        <span class="s-glyph">&#9650;</span>
        <span class="s-lbl">Sunrise</span>
        <span class="s-val" id="sunrise">--:--</span>
      </div>
      <div class="s-row">
        <span class="s-glyph">&#9660;</span>
        <span class="s-lbl">Sunset</span>
        <span class="s-val" id="sunset">--:--</span>
      </div>
    </section>
  </header>

  <div id="clockbox">
    <div id="cluster">
      <div id="clock" aria-live="off">
        <span id="hh">--</span><span class="c" id="c1">:</span><span id="mm">--</span><span id="ss">--</span>
      </div>
      <div id="date">&mdash;</div>
    </div>
  </div>
</div>

<div id="shade" aria-hidden="true"></div>

<div id="glitch-veil" aria-hidden="true"></div>

<div id="ctrls">
  <button id="dim" aria-label="Toggle night dimming" aria-pressed="false">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
  <button id="glitchy" aria-label="Toggle glitch mode" aria-pressed="false">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M3 8h18"/>
      <path d="M5 13h8"/>
      <path d="M16 13h5"/>
      <path d="M3 18h18"/>
    </svg>
  </button>
  <button id="themebtn" aria-label="Cycle color theme">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="16.5" cy="9" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="8" cy="10" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="10.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
    </svg>
  </button>
</div>

<div id="rctrls">
  <button id="refresher" aria-label="Reload page">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
      <path d="M21 3v6h-6"/>
    </svg>
  </button>
</div>

<script>
(function () {
  'use strict';

  // Ciarda Rosie, Timis County, Romania (45.7274 N, 21.267 E)
  var LAT = 45.7274;
  var LNG = 21.267;
  var MB_PAGE = 'https://www.meteoblue.com/en/weather/forecast/current/ciarda-ro%C8%99ie_romania_681965';
  var READER = 'https://r.jina.ai/' + MB_PAGE;
  var RETRY_PERIOD = 5 * 60 * 1000;      // retry sooner on failure (plus jitter)
  var FRESH_WINDOW = 15 * 60 * 1000;     // localStorage cache considered fresh for this long
  var WEATHER_MAX_AGE = 65 * 60 * 1000;  // in the worst case a scrape lands 5 min past the hour
  var CACHE_KEY = 'wallclock.weather.v1';
  var NIGHT_KEY = 'wallclock.night.v1';
  var GLITCH_KEY = 'wallclock.glitch.v1';
  var THEME_KEY = 'wallclock.theme.v1';

  // index 0 = default look; 1..10 = dark editor / shell schemes
  var THEMES = ['dracula', 'nord', 'solarized-dark', 'monokai', 'one-dark',
                'gruvbox', 'tokyo-night', 'catppuccin-mocha', 'rose-pine', 'synthwave84'];

  var weatherTimer = null;
  var cachedWeather = null;

  function el(id) { return document.getElementById(id); }
  var hhEl = el('hh'), mmEl = el('mm'), ssEl = el('ss');
  var dateEl = el('date'), clockEl = el('clock');
  var wTempEl = el('w-temp'), wCondEl = el('w-cond'), wMetaEl = el('w-meta'), wIconEl = el('w-icon');
  var sunriseEl = el('sunrise'), sunsetEl = el('sunset');

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];

  // ---------- clock & date ----------

  function tick() {
    var now = new Date();
    hhEl.textContent = pad(now.getHours());
    mmEl.textContent = pad(now.getMinutes());
    ssEl.textContent = pad(now.getSeconds());

    var ds = DAYS[now.getDay()] + ', ' + now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
    if (dateEl.textContent !== ds) {
      dateEl.textContent = ds;
      applySun(); // new day -> re-evaluate sunrise/sunset
    }
  }

  function sizeClock() {
    var w = window.innerWidth, h = window.innerHeight;
    var px = Math.min(w * 0.19, h * 0.34);
    clockEl.style.fontSize = px + 'px';
  }

  // ---------- sunrise / sunset (fallback computation, NOAA) ----------

  function sunTimesUTC(y, m, d) {
    function jd(yy, mm, dd) {
      if (mm <= 2) { yy -= 1; mm += 12; }
      var A = Math.floor(yy / 100);
      var B = 2 - A + Math.floor(A / 4);
      return Math.floor(365.25 * (yy + 4716)) + Math.floor(30.6001 * (mm + 1)) + dd + B - 1524.5;
    }
    var rad = Math.PI / 180;
    var n = Math.round(jd(y, m, d) - 2451545.0);
    var Jstar = n - LNG / 360;
    var M = (357.5291 + 0.98560028 * Jstar) % 360;
    var C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
    var lambda = (M + C + 180 + 102.9372) % 360;
    var Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lambda * rad);
    var delta = Math.asin(Math.sin(lambda * rad) * Math.sin(23.4397 * rad));
    var cosW = (Math.sin(-0.833 * rad) - Math.sin(LAT * rad) * Math.sin(delta)) /
               (Math.cos(LAT * rad) * Math.cos(delta));
    if (cosW > 1 || cosW < -1) return null;
    var Wdeg = Math.acos(cosW) / rad;
    var Jrise = Jtransit - Wdeg / 360;
    var Jset = Jtransit + Wdeg / 360;
    return { rise: (Jrise - 2440587.5) * 86400000, set: (Jset - 2440587.5) * 86400000 };
  }

  function computedSun(today) {
    var t = sunTimesUTC(today.getFullYear(), today.getMonth() + 1, today.getDate());
    if (!t) return { sunrise: null, sunset: null };
    // tablet-local timezone offset on that day handles DST automatically
    var noon = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12, 0, 0);
    var off = -noon.getTimezoneOffset() / 60;
    function fmt(ms) {
      var dd = new Date(ms + off * 3600000);
      var H = dd.getUTCHours(), Mi = dd.getUTCMinutes();
      return pad(H) + ':' + pad(Mi);
    }
    return { sunrise: fmt(t.rise), sunset: fmt(t.set) };
  }

  // Prefer meteoblue's own sunrise/sunset (comes with the weather scrape);
  // fall back to local computation when the scrape is stale or missing.
  function applySun() {
    var today = new Date();
    var fresh = cachedWeather &&
      cachedWeather.fetchedAt &&
      new Date(cachedWeather.fetchedAt).toDateString() === today.toDateString();
    var sr = null, ss = null;
    if (fresh && cachedWeather.sunrise) sr = cachedWeather.sunrise;
    if (fresh && cachedWeather.sunset) ss = cachedWeather.sunset;
    if (!sr || !ss) {
      var f = computedSun(today);
      if (!sr) sr = f.sunrise;
      if (!ss) ss = f.sunset;
    }
    if (sr) sunriseEl.textContent = sr;
    if (ss) sunsetEl.textContent = ss;
  }

  // ---------- weather (meteoblue via reader proxy, hourly) ----------

  function parseWeather(text) {
    var out = { condition: null, picto: null, tempC: null, windKmh: null, sunrise: null, sunset: null };
    var m = text.match(/!\[(?:Image \d+: )?([^\]]+)\]\((https:\/\/static\.meteoblue\.com\/assets\/images\/picto\/[a-z0-9_]+\.svg)\)\s*(-?[\d.]+)\s*\u00b0([CF])\s*([\d.]+)\s*(mph|km\/h|m\/s|bft)/i);
    if (m) {
      out.condition = m[1].trim();
      out.picto = m[2];
      var t = parseFloat(m[3]);
      out.tempC = m[4].toUpperCase() === 'F' ? Math.round((t - 32) * 5 / 9) : Math.round(t);
      var w = parseFloat(m[5]);
      var unit = m[6].toLowerCase();
      if (unit === 'mph') out.windKmh = Math.round(w * 1.60934);
      else if (unit === 'km/h') out.windKmh = Math.round(w);
      else if (unit === 'm/s') out.windKmh = Math.round(w * 3.6);
    }
    var sr = text.match(/\u25b2[^\d]{0,10}([0-9]{1,2}:[0-9]{2})/);
    var ss = text.match(/\u25bc[^\d]{0,10}([0-9]{1,2}:[0-9]{2})/);
    if (sr) out.sunrise = sr[1];
    if (ss) out.sunset = ss[1];
    return out;
  }

  // Night pictograms use a dark navy (#023557) that disappears on the black
  // page, so fetch the SVG (host allows CORS) and recolor it before showing.
  function setWeatherIcon(url) {
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (svg) {
      // night moon fill: dark navy -> light blue; dark outline strokes that
      // read as a border on the black page -> transparent
      svg = svg.split('stroke:#023557').join('stroke:rgba(0,0,0,0)')
               .split('stroke:#062845').join('stroke:rgba(0,0,0,0)')
               .split('#023557').join('#9ec9f2');
      var uri;
      try {
        uri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
      } catch (e) {
        uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }
      wIconEl.src = uri;
    }).catch(function () {
      wIconEl.src = url;
    });
  }

  function renderWeather(data) {
    if (data.tempC !== null && data.tempC !== undefined) wTempEl.textContent = data.tempC;
    if (data.condition) wCondEl.textContent = data.condition;
    if (data.picto) setWeatherIcon(data.picto);
    var meta = 'meteoblue \u00b7 Ciarda Rosie';
    if (typeof data.windKmh === 'number') meta = 'wind ' + data.windKmh + ' km/h \u00b7 ' + meta;
    var upd = data.fetchedAt ? ' \u00b7 updated ' + pad(new Date(data.fetchedAt).getHours()) + ':' + pad(new Date(data.fetchedAt).getMinutes()) : '';
    wMetaEl.textContent = meta + upd;
    applySun();
  }

  function store(data) {
    cachedWeather = data;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadStored() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      cachedWeather = data;
      return data;
    } catch (e) { return null; }
  }

  // Delay until the next top of the hour plus a random 30 s - 5 min offset,
  // so the page never hits meteoblue at the same minute each hour.
  function nextHourlyDelay() {
    var now = new Date();
    var top = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours() + 1, 0, 0, 0);
    return top - now + 30000 + Math.random() * 270000;
  }

  function schedule(delayMs) {
    if (weatherTimer) clearTimeout(weatherTimer);
    weatherTimer = setTimeout(fetchWeather, delayMs);
  }

  function fetchWeather() {
    fetch(READER).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (text) {
      var data = parseWeather(text);
      if (!data.condition && !data.tempC) throw new Error('parse failed');
      data.fetchedAt = Date.now();
      store(data);
      renderWeather(data);
      schedule(nextHourlyDelay());
    }).catch(function () {
      schedule(RETRY_PERIOD + Math.random() * 60000);
    });
  }

  // ---------- night dim & glitch ----------

  var dimBtn = el('dim');
  var glitchBtn = el('glitchy');

  function setNight(on) {
    document.body.classList[on ? 'add' : 'remove']('night');
    dimBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem(NIGHT_KEY, on ? '1' : '0'); } catch (e) {}
  }

  dimBtn.addEventListener('click', function () {
    setNight(!document.body.classList.contains('night'));
  });

  function setGlitch(on) {
    document.body.classList[on ? 'add' : 'remove']('glitch');
    glitchBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem(GLITCH_KEY, on ? '1' : '0'); } catch (e) {}
  }

  glitchBtn.addEventListener('click', function () {
    setGlitch(!document.body.classList.contains('glitch'));
  });

  // ---------- color themes ----------

  var themeBtn = el('themebtn');
  var themeIndex = 0; // 0 = default, 1..THEMES.length

  function applyTheme(i) {
    themeIndex = ((i % (THEMES.length + 1)) + (THEMES.length + 1)) % (THEMES.length + 1);
    if (themeIndex === 0) {
      document.body.removeAttribute('data-theme');
    } else {
      document.body.setAttribute('data-theme', THEMES[themeIndex - 1]);
    }
    try { localStorage.setItem(THEME_KEY, String(themeIndex)); } catch (e) {}
  }

  themeBtn.addEventListener('click', function () {
    applyTheme(themeIndex + 1);
  });

  // ---------- reload ----------

  el('refresher').addEventListener('click', function () {
    location.reload();
  });

  // ---------- boot ----------

  sizeClock();
  window.addEventListener('resize', sizeClock);

  try {
    if (localStorage.getItem(NIGHT_KEY) === '1') setNight(true);
    if (localStorage.getItem(GLITCH_KEY) === '1') setGlitch(true);
    var savedTheme = parseInt(localStorage.getItem(THEME_KEY), 10);
    if (savedTheme >= 0 && savedTheme <= THEMES.length) applyTheme(savedTheme);
  } catch (e) {}

  var cached = loadStored();
  if (cached) renderWeather(cached);
  applySun();

  tick();
  setInterval(tick, 250);

  // cached data younger than FRESH_WINDOW: skip the boot scrape,
  // wait for the next jittered hourly slot instead
  if (cached && (Date.now() - cached.fetchedAt) < FRESH_WINDOW) {
    schedule(nextHourlyDelay());
  } else {
    fetchWeather();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      var stale = !cachedWeather || (Date.now() - cachedWeather.fetchedAt) > WEATHER_MAX_AGE;
      if (stale) fetchWeather();
    }
  });
})();
</script>
</body>
</html>
